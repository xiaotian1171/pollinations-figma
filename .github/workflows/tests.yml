name: tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Type check against the Figma typings
        run: npm run typecheck
      - name: Offline checks
        run: npm test
      - name: Build the plugin
        run: npm run build
